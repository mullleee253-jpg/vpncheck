<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VPN Monitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #07080c;
            --card: rgba(17, 18, 24, .72);
            --border: rgba(255, 255, 255, .08);
            --text: #f5f5f7;
            --muted: #777b86;
            --green: #35e98b;
            --red: #ff4d5e;
            --yellow: #ffc857;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);
            background: var(--bg);

            overflow-x: hidden;
        }

        /* Background */

        .background {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .glow {
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            filter: blur(100px);
            opacity: .08;

            animation: float 12s ease-in-out infinite;
        }

        .glow.one {
            top: -180px;
            left: -120px;
            background: #526dff;
        }

        .glow.two {
            right: -180px;
            bottom: -180px;
            background: #20d989;
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(35px, 25px);
            }
        }

        /* App */

        .app {
            position: relative;
            z-index: 1;

            width: min(900px, calc(100% - 32px));

            margin: 0 auto;

            padding: 70px 0 45px;
        }

        /* Header */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 38px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .logo {
            width: 40px;
            height: 40px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(255,255,255,.055);
            border: 1px solid var(--border);

            font-size: 17px;

            box-shadow:
                0 10px 35px rgba(0,0,0,.25);
        }

        .brand-title {
            font-size: 17px;
            font-weight: 700;

            letter-spacing: -.3px;
        }

        .brand-subtitle {
            margin-top: 3px;

            color: var(--muted);

            font-size: 11px;
        }

        .live {
            display: flex;
            align-items: center;
            gap: 7px;

            color: var(--muted);

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1px;
        }

        .live-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--green);

            box-shadow:
                0 0 10px rgba(53,233,139,.8);

            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }

        /* Cards */

        .servers {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 14px;
        }

        .server {
            position: relative;

            padding: 22px;

            border-radius: 19px;

            background: var(--card);

            border: 1px solid var(--border);

            backdrop-filter: blur(20px);

            overflow: hidden;

            transform: translateY(0);

            transition:
                border-color .35s ease,
                transform .35s ease,
                background .35s ease,
                box-shadow .35s ease;
        }

        .server::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 100%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.35),
                    transparent
                );

            animation: scan 5s linear infinite;
        }

        @keyframes scan {
            0% {
                left: -100%;
            }

            50%, 100% {
                left: 100%;
            }
        }

        .server:hover {
            transform: translateY(-3px);

            border-color:
                rgba(255,255,255,.14);

            background:
                rgba(20,21,28,.78);

            box-shadow:
                0 20px 60px rgba(0,0,0,.25);
        }

        .server.offline {
            border-color:
                rgba(255,77,94,.35);

            background:
                linear-gradient(
                    145deg,
                    rgba(45,15,20,.72),
                    rgba(17,18,24,.78)
                );

            box-shadow:
                0 0 35px rgba(255,77,94,.06);
        }

        .server.offline::after {
            content: "";

            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at 100% 0%,
                    rgba(255,77,94,.09),
                    transparent 45%
                );
        }

        /* Server top */

        .server-top {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .server-name {
            display: flex;
            align-items: center;

            gap: 11px;
        }

        .flag {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background:
                rgba(255,255,255,.045);

            border: 1px solid
                rgba(255,255,255,.055);

            font-size: 20px;
        }

        .name {
            font-size: 15px;
            font-weight: 700;
        }

        .type {
            margin-top: 3px;

            color: var(--muted);

            font-size: 10px;
        }

        /* Status */

        .status {
            display: flex;
            align-items: center;
            gap: 6px;

            padding: 6px 9px;

            border-radius: 999px;

            background:
                rgba(255,255,255,.035);

            font-size: 9px;
            font-weight: 800;

            letter-spacing: .8px;

            transition:
                color .3s,
                background .3s;
        }

        .dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            transition:
                background .3s,
                box-shadow .3s;
        }

        .status.online {
            color: var(--green);
            background:
                rgba(53,233,139,.055);
        }

        .status.online .dot {
            background: var(--green);

            box-shadow:
                0 0 9px rgba(53,233,139,.8);
        }

        .status.offline {
            color: var(--red);
            background:
                rgba(255,77,94,.08);
        }

        .status.offline .dot {
            background: var(--red);

            box-shadow:
                0 0 10px rgba(255,77,94,.8);

            animation:
                offlinePulse 1.5s infinite;
        }

        .status.checking {
            color: var(--yellow);
        }

        .status.checking .dot {
            background: var(--yellow);

            box-shadow:
                0 0 9px rgba(255,200,87,.7);

            animation:
                checkingPulse .8s infinite;
        }

        @keyframes checkingPulse {
            50% {
                opacity: .25;
                transform: scale(.65);
            }
        }

        @keyframes offlinePulse {
            50% {
                opacity: .45;
            }
        }

        /* Endpoint */

        .endpoint {
            margin-top: 22px;

            padding-top: 17px;

            border-top:
                1px solid rgba(255,255,255,.055);
        }

        .endpoint-label {
            color: #5f6370;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .endpoint-value {
            margin-top: 6px;

            color: #bfc3cd;

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 12px;
        }

        /* Bottom */

        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            margin-top: 20px;
        }

        .latency-label {
            color: #5f6370;

            font-size: 9px;
            font-weight: 700;

            letter-spacing: 1px;
        }

        .latency {
            margin-top: 4px;

            font-size: 25px;
            font-weight: 750;

            letter-spacing: -1px;

            transition:
                color .3s;
        }

        .latency span {
            color: #656a77;

            font-size: 11px;
            font-weight: 500;

            letter-spacing: 0;
        }

        .offline .latency {
            color: var(--red);
        }

        .online .latency {
            color: var(--green);
        }

        .protocol {
            color: #555b68;

            font-size: 10px;
            font-family: monospace;
        }

        /* Footer */

        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-top: 20px;

            color: #505563;

            font-size: 10px;
        }

        .refresh {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            border: 1px solid
                rgba(255,255,255,.08);

            background:
                rgba(255,255,255,.045);

            color: #cdd1db;

            padding: 8px 12px;

            border-radius: 9px;

            cursor: pointer;

            font-size: 10px;
            font-weight: 700;

            transition:
                background .2s,
                border-color .2s,
                transform .2s;
        }

        button:hover {
            background:
                rgba(255,255,255,.08);

            border-color:
                rgba(255,255,255,.14);
        }

        button:active {
            transform: scale(.96);
        }

        button:disabled {
            opacity: .45;
            cursor: default;
        }

        .spin {
            display: inline-block;
        }

        button.loading .spin {
            animation:
                rotate .7s linear infinite;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */

        @media (max-width: 700px) {

            .app {
                padding-top: 35px;
            }

            header {
                align-items: flex-start;
            }

            .servers {
                grid-template-columns: 1fr;
            }

            .server {
                padding: 20px;
            }

        }

        @media (max-width: 450px) {

            header {
                flex-direction: column;
                gap: 14px;
            }

            .live {
                margin-left: 53px;
            }

            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

        }

    </style>

</head>


<body>

<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>


<div class="app">


<header>

    <div class="brand">

        <div class="logo">
            ◈
        </div>

        <div>

            <div class="brand-title">
                VPN Monitor
            </div>

            <div class="brand-subtitle">
                Server availability
            </div>

        </div>

    </div>


    <div class="live">

        <span class="live-dot"></span>

        LIVE

    </div>

</header>



<div class="servers">


    <!-- SWITZERLAND -->

    <div
        class="server"
        id="card-ch"
    >

        <div class="server-top">

            <div class="server-name">

                <div class="flag">
                    🇨🇭
                </div>

                <div>

                    <div class="name">
                        Switzerland
                    </div>

                    <div class="type">
                        VPN Server
                    </div>

                </div>

            </div>


            <div
                id="status-ch"
                class="status checking"
            >

                <span class="dot"></span>

                CHECKING

            </div>

        </div>


        <div class="endpoint">

            <div class="endpoint-label">
                Endpoint
            </div>

            <div class="endpoint-value">
                31.76.4.168:25558
            </div>

        </div>


        <div class="bottom">

            <div>

                <div class="latency-label">
                    TCP LATENCY
                </div>

                <div
                    id="latency-ch"
                    class="latency"
                >
                    —
                    <span>ms</span>
                </div>

            </div>

            <div class="protocol">
                TCP
            </div>

        </div>

    </div>



    <!-- POLAND -->

    <div
        class="server"
        id="card-pl"
    >

        <div class="server-top">

            <div class="server-name">

                <div class="flag">
                    🇵🇱
                </div>

                <div>

                    <div class="name">
                        Poland
                    </div>

                    <div class="type">
                        VPN Server
                    </div>

                </div>

            </div>


            <div
                id="status-pl"
                class="status checking"
            >

                <span class="dot"></span>

                CHECKING

            </div>

        </div>


        <div class="endpoint">

            <div class="endpoint-label">
                Endpoint
            </div>

            <div class="endpoint-value">
                2.26.255.84:27489
            </div>

        </div>


        <div class="bottom">

            <div>

                <div class="latency-label">
                    TCP LATENCY
                </div>

                <div
                    id="latency-pl"
                    class="latency"
                >
                    —
                    <span>ms</span>
                </div>

            </div>

            <div class="protocol">
                TCP
            </div>

        </div>

    </div>

</div>



<div class="footer">

    <div id="updated">
        Checking servers...
    </div>


    <div class="refresh">

        <button
            id="refresh"
            onclick="checkAll()"
        >

            <span class="spin">↻</span>

            Проверить

        </button>

    </div>

</div>


</div>



<script>

const SERVERS = {

    ch: {
        host: "31.76.4.168",
        port: 25558
    },

    pl: {
        host: "2.26.255.84",
        port: 27489
    }

};


function setStatus(
    server,
    state,
    latency = null
) {

    const status =
        document.getElementById(
            "status-" + server
        );

    const card =
        document.getElementById(
            "card-" + server
        );

    const latencyElement =
        document.getElementById(
            "latency-" + server
        );


    card.classList.remove(
        "offline"
    );


    if (state === "online") {

        status.className =
            "status online";

        status.innerHTML = `
            <span class="dot"></span>
            ONLINE
        `;

        latencyElement.innerHTML =
            `${Math.round(latency)}
             <span>ms</span>`;

    }


    else if (state === "offline") {

        status.className =
            "status offline";

        status.innerHTML = `
            <span class="dot"></span>
            OFFLINE
        `;

        latencyElement.innerHTML =
            `DOWN <span>—</span>`;

        card.classList.add(
            "offline"
        );

    }


    else {

        status.className =
            "status checking";

        status.innerHTML = `
            <span class="dot"></span>
            CHECKING
        `;

        latencyElement.innerHTML =
            `—
             <span>ms</span>`;

    }

}


async function checkServer(server) {

    setStatus(
        server,
        "checking"
    );


    try {

        const response =
            await fetch(
                `/api/check?server=${server}&t=${Date.now()}`,
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "HTTP " +
                response.status
            );

        }


        if (
            data.status === "online"
        ) {

            setStatus(
                server,
                "online",
                data.response_time_ms
            );

            return true;

        }


        setStatus(
            server,
            "offline"
        );

        return false;


    } catch (error) {

        console.error(
            "VPN check:",
            server,
            error
        );

        setStatus(
            server,
            "offline"
        );

        return false;

    }

}


async function checkAll() {

    const button =
        document.getElementById(
            "refresh"
        );

    const updated =
        document.getElementById(
            "updated"
        );


    button.disabled = true;

    button.classList.add(
        "loading"
    );


    updated.textContent =
        "Checking servers...";


    const results =
        await Promise.all([
            checkServer("ch"),
            checkServer("pl")
        ]);


    const online =
        results.filter(Boolean).length;


    const now =
        new Date();


    if (online === 2) {

        updated.textContent =
            "All systems operational · " +
            now.toLocaleTimeString(
                "ru-RU"
            );

    }

    else if (online === 1) {

        updated.textContent =
            "1 server offline · " +
            now.toLocaleTimeString(
                "ru-RU"
            );

    }

    else {

        updated.textContent =
            "All servers offline · " +
            now.toLocaleTimeString(
                "ru-RU"
            );

    }


    button.disabled = false;

    button.classList.remove(
        "loading"
    );

}


checkAll();


setInterval(
    checkAll,
    30000
);

</script>

</body>

</html>
