<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Nodes</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
    background:#000;
    color:#fff;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
    background:
        radial-gradient(circle at 50% 45%,#111 0%,#050505 35%,#000 72%);
}

.orb{
    position:absolute;
    width:420px;
    height:420px;
    border-radius:50%;
    filter:blur(100px);
    opacity:.13;
    animation:orb 18s ease-in-out infinite alternate;
}

.orb.one{
    background:#fff;
    left:-180px;
    top:-160px;
}

.orb.two{
    background:#777;
    right:-200px;
    bottom:-160px;
    animation-delay:-8s;
}

@keyframes orb{
    0%{
        transform:translate3d(0,0,0) scale(1);
    }
    50%{
        transform:translate3d(120px,80px,0) scale(1.2);
    }
    100%{
        transform:translate3d(-50px,150px,0) scale(.9);
    }
}

/* ================= FLYING PARTICLES ================= */

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:0;
    animation:fly linear infinite;
}

@keyframes fly{
    0%{
        transform:translate3d(0,120vh,0) scale(.3);
        opacity:0;
    }

    10%{
        opacity:.5;
    }

    50%{
        opacity:.9;
    }

    90%{
        opacity:.3;
    }

    100%{
        transform:translate3d(180px,-20vh,0) scale(1);
        opacity:0;
    }
}

/* ================= LINES ================= */

.line{
    position:absolute;
    width:500px;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.12),
        transparent
    );
    transform:rotate(-28deg);
    animation:lineMove 9s linear infinite;
}

.line:nth-child(1){
    top:20%;
    left:-500px;
}

.line:nth-child(2){
    top:55%;
    left:-700px;
    animation-delay:3s;
    opacity:.5;
}

.line:nth-child(3){
    top:80%;
    left:-600px;
    animation-delay:6s;
    opacity:.35;
}

@keyframes lineMove{
    from{
        transform:translateX(0) rotate(-28deg);
    }
    to{
        transform:translateX(180vw) rotate(-28deg);
    }
}

/* ================= CONTENT ================= */

.content{
    position:relative;
    z-index:2;
}

/* ================= CARD ================= */

.card{
    position:relative;
    overflow:hidden;
    background:rgba(10,10,10,.72);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);

    transition:
        transform .5s cubic-bezier(.2,.8,.2,1),
        border-color .5s ease,
        box-shadow .5s ease;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at 80% 0%,
            rgba(255,255,255,.055),
            transparent 35%
        );
    pointer-events:none;
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,.18);
    box-shadow:
        0 30px 100px rgba(0,0,0,.7),
        inset 0 1px rgba(255,255,255,.04);
}

/* ================= STATUS ================= */

.status{
    display:flex;
    align-items:center;
    gap:8px;
    padding:7px 11px;
    border-radius:999px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);
    font-size:10px;
    font-weight:800;
    letter-spacing:.14em;
}

.dot{
    width:6px;
    height:6px;
    border-radius:50%;
    transition:.4s ease;
}

.online{
    background:#4ade80;
    box-shadow:
        0 0 7px #4ade80,
        0 0 18px rgba(74,222,128,.45);
    animation:pulseDot 2s ease-in-out infinite;
}

.offline{
    background:#ef4444;
    box-shadow:
        0 0 8px #ef4444;
}

.checking{
    background:#a3a3a3;
    animation:pulseDot 1s ease-in-out infinite;
}

@keyframes pulseDot{
    0%,100%{
        transform:scale(.8);
        opacity:.6;
    }
    50%{
        transform:scale(1.15);
        opacity:1;
    }
}

/* ================= BUTTON ================= */

.refresh{
    position:relative;
    overflow:hidden;
    background:#fff;
    color:#000;
    transition:
        transform .25s ease,
        box-shadow .35s ease;
}

.refresh::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:70%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.7),
        transparent
    );
    transform:skewX(-20deg);
    transition:left .6s ease;
}

.refresh:hover::after{
    left:140%;
}

.refresh:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 45px rgba(255,255,255,.12);
}

.refresh:active{
    transform:scale(.97);
}

.spin{
    animation:spin .7s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* ================= IP BOX ================= */

.info{
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.06);
    transition:
        background .3s ease,
        border-color .3s ease;
}

.info:hover{
    background:rgba(255,255,255,.045);
    border-color:rgba(255,255,255,.11);
}

/* ================= ANIMATION ================= */

.fade{
    animation:fade .6s cubic-bezier(.2,.8,.2,1);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(8px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= PROGRESS ================= */

.progress{
    height:1px;
    background:rgba(255,255,255,.06);
    overflow:hidden;
}

.progress-inner{
    height:100%;
    width:100%;
    background:rgba(255,255,255,.6);
    transform-origin:left;
}

.progress-run{
    animation:progress 30s linear forwards;
}

@keyframes progress{
    from{transform:scaleX(1)}
    to{transform:scaleX(0)}
}

/* ================= NOISE ================= */

.noise{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    opacity:.025;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
</style>
</head>

<script>

/* =========================================================
   SERVERS
========================================================= */

const SERVERS = [
    {
        id: "ch",
        name: "Switzerland",
        ip: "31.76.4.168",
        port: 25558
    },
    {
        id: "pl",
        name: "Poland",
        ip: "2.26.255.84",
        port: 27489
    }
];

const INTERVAL = 30000;

let refreshing = false;


/* =========================================================
   HELPERS
========================================================= */

function sleep(ms){
    return new Promise(resolve => setTimeout(resolve, ms));
}


/* =========================================================
   UI CHECKING
========================================================= */

function setChecking(server){

    const id = server.id;

    document.getElementById(`dot-${id}`).className =
        "dot checking";

    document.getElementById(`status-${id}`).textContent =
        "CHECKING";

    document.getElementById(`status-${id}`).className =
        "text-neutral-400";

    document.getElementById(`ping-${id}`).textContent =
        "—";

    document.getElementById(`source-${id}`).textContent =
        "checking...";

}


/* =========================================================
   UI ONLINE
========================================================= */

function setOnline(server, ping, source){

    const id = server.id;

    const card =
        document.getElementById(`card-${id}`);

    document.getElementById(`dot-${id}`).className =
        "dot online";

    document.getElementById(`status-${id}`).textContent =
        "ONLINE";

    document.getElementById(`status-${id}`).className =
        "text-green-400";

    document.getElementById(`ping-${id}`).textContent =
        ping ?? "—";

    document.getElementById(`source-${id}`).textContent =
        source || "TCP";

    card.classList.remove("fade");

    void card.offsetWidth;

    card.classList.add("fade");
}


/* =========================================================
   UI OFFLINE
========================================================= */

function setOffline(server, unknown=false){

    const id = server.id;

    document.getElementById(`dot-${id}`).className =
        unknown
            ? "dot checking"
            : "dot offline";

    document.getElementById(`status-${id}`).textContent =
        unknown
            ? "UNKNOWN"
            : "OFFLINE";

    document.getElementById(`status-${id}`).className =
        unknown
            ? "text-yellow-500"
            : "text-red-400";

    document.getElementById(`ping-${id}`).textContent =
        "—";

    document.getElementById(`source-${id}`).textContent =
        unknown
            ? "API unavailable"
            : "TCP timeout";
}


/* =========================================================
   TCP CHECK
========================================================= */

async function checkTCP(server){

    const target =
        `${server.ip}:${server.port}`;

    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            12000
        );

    try{

        /*
         * Check-Host API
         *
         * Браузер не может открыть TCP socket
         * самостоятельно, поэтому TCP check
         * выполняется удалённой проверяющей нодой.
         */

        const createURL =
            "https://check-host.net/check-tcp" +
            "?host=" +
            encodeURIComponent(target) +
            "&max_nodes=1";

        const response =
            await fetch(
                createURL,
                {
                    cache:"no-store",
                    signal:controller.signal
                }
            );

        if(!response.ok){
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        if(!data.request_id){
            throw new Error(
                "No request ID"
            );
        }


        /*
         * Получаем результат.
         */

        for(let i=0;i<12;i++){

            await sleep(650);

            const resultResponse =
                await fetch(
                    "https://check-host.net/check-result/" +
                    encodeURIComponent(
                        data.request_id
                    ),
                    {
                        cache:"no-store",
                        signal:controller.signal
                    }
                );

            if(!resultResponse.ok){
                continue;
            }

            const result =
                await resultResponse.json();


            const values =
                Object.values(result || {});


            for(const value of values){

                if(value == null){
                    continue;
                }


                /*
                 * Возможные структуры
                 * результата Check-Host.
                 */

                if(Array.isArray(value)){

                    for(const item of value){

                        if(
                            item &&
                            typeof item === "object"
                        ){

                            if(
                                typeof item.time === "number"
                            ){

                                return {
                                    online:true,
                                    ping:Math.round(
                                        item.time * 1000
                                    ),
                                    source:"TCP"
                                };
                            }

                            if(item.error){
                                return {
                                    online:false,
                                    source:"TCP"
                                };
                            }
                        }
                    }

                }else if(
                    typeof value === "object"
                ){

                    if(
                        typeof value.time === "number"
                    ){

                        return {
                            online:true,
                            ping:Math.round(
                                value.time * 1000
                            ),
                            source:"TCP"
                        };
                    }

                    if(value.error){

                        return {
                            online:false,
                            source:"TCP"
                        };

                    }
                }
            }
        }

        throw new Error(
            "TCP check timeout"
        );

    }finally{

        clearTimeout(timeout);

    }
}


/* =========================================================
   CHECK SERVER
========================================================= */

async function checkServer(server){

    setChecking(server);

    try{

        const result =
            await checkTCP(server);

        if(result.online){

            setOnline(
                server,
                result.ping,
                result.source
            );

        }else{

            setOffline(server);

        }

    }catch(error){

        console.warn(
            `${server.name}:`,
            error
        );

        /*
         * Если сам внешний API недоступен,
         * не говорим пользователю, что VPN-нода
         * точно OFFLINE.
         */

        setOffline(
            server,
            true
        );
    }
}


/* =========================================================
   REFRESH ALL
========================================================= */

async function refreshAll(){

    if(refreshing){
        return;
    }

    refreshing = true;


    const button =
        document.getElementById(
            "refreshButton"
        );

    const icon =
        document.getElementById(
            "refreshIcon"
        );

    const progress =
        document.getElementById(
            "progressBar"
        );


    button.disabled = true;

    button.style.opacity = ".65";

    icon.classList.add("spin");


    /*
     * Restart progress animation.
     */

    progress.classList.remove(
        "progress-run"
    );

    void progress.offsetWidth;

    progress.classList.add(
        "progress-run"
    );


    /*
     * Проверяем обе ноды одновременно.
     */

    await Promise.all(
        SERVERS.map(
            server => checkServer(server)
        )
    );


    /*
     * Последнее обновление.
     */

    document.getElementById(
        "lastUpdate"
    ).textContent =
        new Date().toLocaleTimeString(
            "ru-RU",
            {
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );


    icon.classList.remove("spin");

    button.disabled = false;

    button.style.opacity = "1";

    refreshing = false;
}


/* =========================================================
   INITIAL
========================================================= */

refreshAll();


/* =========================================================
   AUTO UPDATE
========================================================= */

setInterval(
    refreshAll,
    INTERVAL
);

</script>
