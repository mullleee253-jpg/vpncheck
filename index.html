<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Status Monitor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at 20% 10%, rgba(70,100,255,.18), transparent 35%),
                radial-gradient(circle at 80% 90%, rgba(0,220,180,.12), transparent 35%),
                #070a12;
        }

        .container {
            width: 100%;
            max-width: 1050px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 45px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #39ff88;
            box-shadow: 0 0 12px #39ff88;
        }

        h1 {
            margin-top: 20px;
            font-size: clamp(40px, 7vw, 70px);
            letter-spacing: -3px;
        }

        .subtitle {
            margin-top: 15px;
            color: #858b9b;
        }

        .servers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .card {
            padding: 28px;
            border-radius: 24px;
            background: rgba(17,21,34,.85);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 25px 70px rgba(0,0,0,.35);
            backdrop-filter: blur(18px);
            transition: .25s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,.16);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .country {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .flag {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            background: rgba(255,255,255,.06);
            font-size: 27px;
        }

        .country h2 {
            font-size: 21px;
        }

        .country p {
            margin-top: 5px;
            color: #737a8d;
            font-size: 13px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 11px;
            border-radius: 999px;
            background: rgba(255,255,255,.05);
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #777;
        }

        .status.online {
            color: #49f59a;
        }

        .status.online .status-dot {
            background: #49f59a;
            box-shadow: 0 0 12px #49f59a;
        }

        .status.offline {
            color: #ff5964;
        }

        .status.offline .status-dot {
            background: #ff5964;
            box-shadow: 0 0 12px #ff5964;
        }

        .status.checking {
            color: #ffd75a;
        }

        .status.checking .status-dot {
            background: #ffd75a;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: .25;
            }
        }

        .endpoint {
            margin-top: 30px;
            padding: 16px;
            border-radius: 14px;
            background: rgba(0,0,0,.18);
            border: 1px solid rgba(255,255,255,.05);
        }

        .endpoint-label {
            color: #686f81;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .endpoint-value {
            margin-top: 7px;
            font-family: monospace;
            font-size: 15px;
            color: #d9deeb;
        }

        .bottom {
            margin-top: 24px;
        }

        .latency-label {
            color: #686f81;
            font-size: 12px;
        }

        .latency {
            margin-top: 5px;
            font-size: 28px;
            font-weight: 800;
        }

        .latency small {
            font-size: 13px;
            color: #777e90;
            font-weight: normal;
        }

        .refresh {
            display: flex;
            justify-content: center;
            margin-top: 35px;
        }

        button {
            cursor: pointer;
            padding: 13px 22px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            background: rgba(255,255,255,.07);
            color: white;
            font-size: 14px;
            font-weight: bold;
            transition: .2s;
        }

        button:hover {
            background: rgba(255,255,255,.12);
        }

        button:disabled {
            opacity: .5;
            cursor: default;
        }

        .updated {
            margin-top: 15px;
            text-align: center;
            color: #555c6d;
            font-size: 12px;
        }

        @media (max-width: 700px) {
            body {
                padding: 25px 15px;
            }

            .servers {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="badge">
            <span class="badge-dot"></span>
            LIVE MONITORING
        </div>

        <h1>VPN Status</h1>

        <p class="subtitle">
            Проверка доступности VPN-серверов
        </p>
    </header>

    <main class="servers">

        <!-- SWITZERLAND -->

        <section class="card">

            <div class="top">

                <div class="country">
                    <div class="flag">🇨🇭</div>

                    <div>
                        <h2>Switzerland</h2>
                        <p>VPN Server</p>
                    </div>
                </div>

                <div class="status checking" id="status-ch">
                    <span class="status-dot"></span>
                    <span>CHECKING</span>
                </div>

            </div>

            <div class="endpoint">
                <div class="endpoint-label">
                    Endpoint
                </div>

                <div class="endpoint-value">
                    31.76.4.168:25558
                </div>
            </div>

            <div class="bottom">

                <div class="latency-label">
                    TCP LATENCY
                </div>

                <div class="latency" id="latency-ch">
                    — <small>ms</small>
                </div>

            </div>

        </section>


        <!-- POLAND -->

        <section class="card">

            <div class="top">

                <div class="country">
                    <div class="flag">🇵🇱</div>

                    <div>
                        <h2>Poland</h2>
                        <p>VPN Server</p>
                    </div>
                </div>

                <div class="status checking" id="status-pl">
                    <span class="status-dot"></span>
                    <span>CHECKING</span>
                </div>

            </div>

            <div class="endpoint">
                <div class="endpoint-label">
                    Endpoint
                </div>

                <div class="endpoint-value">
                    2.26.255.84:27489
                </div>
            </div>

            <div class="bottom">

                <div class="latency-label">
                    TCP LATENCY
                </div>

                <div class="latency" id="latency-pl">
                    — <small>ms</small>
                </div>

            </div>

        </section>

    </main>


    <div class="refresh">
        <button id="refreshButton">
            Проверить сейчас
        </button>
    </div>

    <div class="updated" id="lastUpdate">
        Проверка ещё не выполнялась
    </div>

</div>


<script>

const SERVERS = {
    ch: {
        host: "31.76.4.168",
        port: 25558
    },

    pl: {
        host: "2.26.255.84",
        port: 27489
    }
};


function setStatus(server, state, latency = null) {

    const status =
        document.getElementById(`status-${server}`);

    const latencyElement =
        document.getElementById(`latency-${server}`);


    if (state === "online") {

        status.className = "status online";

        status.innerHTML = `
            <span class="status-dot"></span>
            <span>ONLINE</span>
        `;

        latencyElement.innerHTML =
            `${latency} <small>ms</small>`;

    }

    else if (state === "offline") {

        status.className = "status offline";

        status.innerHTML = `
            <span class="status-dot"></span>
            <span>OFFLINE</span>
        `;

        latencyElement.innerHTML =
            `— <small>ms</small>`;

    }

    else {

        status.className = "status checking";

        status.innerHTML = `
            <span class="status-dot"></span>
            <span>CHECKING</span>
        `;

        latencyElement.innerHTML =
            `— <small>ms</small>`;
    }
}


async function checkServer(server) {

    setStatus(server, "checking");

    try {

        const response = await fetch(
            `/api/check?server=${server}&_=${Date.now()}`,
            {
                cache: "no-store"
            }
        );


        const data = await response.json();


        if (!response.ok) {
            throw new Error(
                data.error || `HTTP ${response.status}`
            );
        }


        if (data.status === "online") {

            setStatus(
                server,
                "online",
                data.response_time_ms
            );

        } else {

            setStatus(
                server,
                "offline"
            );
        }


    } catch (error) {

        console.error(
            `Check ${server}:`,
            error
        );

        setStatus(
            server,
            "offline"
        );
    }
}


async function checkAll() {

    const button =
        document.getElementById("refreshButton");

    button.disabled = true;


    await Promise.all([
        checkServer("ch"),
        checkServer("pl")
    ]);


    document.getElementById(
        "lastUpdate"
    ).textContent =
        "Последняя проверка: " +
        new Date().toLocaleTimeString("ru-RU");


    button.disabled = false;
}


document
    .getElementById("refreshButton")
    .addEventListener(
        "click",
        checkAll
    );


checkAll();


setInterval(
    checkAll,
    30000
);

</script>

</body>
</html>
