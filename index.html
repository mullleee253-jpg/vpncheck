<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VPN Monitor</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color: #f5f7ff;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(77, 110, 255, .20),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 100%,
            rgba(0, 220, 170, .12),
            transparent 30%
        ),
        #070912;
}


/* GRID */

body::before {
    content: "";

    position: fixed;
    inset: 0;

    pointer-events: none;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size: 50px 50px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 80%
        );
}


/* CONTAINER */

.container {
    width: min(1100px, calc(100% - 36px));
    margin: 0 auto;
    padding: 55px 0 40px;
}


/* HEADER */

header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;

    gap: 30px;

    margin-bottom: 32px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 48px;
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(92,117,255,.30),
            rgba(0,220,180,.14)
        );

    border: 1px solid rgba(255,255,255,.10);

    box-shadow:
        0 0 35px rgba(75,100,255,.15);

    font-size: 22px;
}

.eyebrow {
    color: #777f96;

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 2px;
    text-transform: uppercase;

    margin-bottom: 5px;
}

h1 {
    margin: 0;

    font-size: 34px;
    line-height: 1;

    letter-spacing: -1.5px;
}

.header-right {
    text-align: right;
}

.live {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 8px 12px;

    border-radius: 999px;

    background: rgba(56, 245, 145, .07);
    border: 1px solid rgba(56, 245, 145, .13);

    color: #52f39c;

    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1px;
}

.live-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #52f39c;

    box-shadow:
        0 0 12px #52f39c;

    animation: livePulse 1.6s infinite;
}

@keyframes livePulse {

    50% {
        opacity: .35;
    }

}


/* SUMMARY */

.summary {
    display: grid;
    grid-template-columns:
        repeat(3, 1fr);

    gap: 14px;

    margin-bottom: 22px;
}

.summary-card {
    padding: 17px 19px;

    border-radius: 17px;

    background: rgba(15,19,31,.72);

    border: 1px solid rgba(255,255,255,.065);

    backdrop-filter: blur(14px);
}

.summary-label {
    color: #656d82;

    font-size: 10px;
    font-weight: 800;

    letter-spacing: 1.2px;
    text-transform: uppercase;
}

.summary-value {
    margin-top: 7px;

    font-size: 23px;
    font-weight: 800;
}

.green {
    color: #52f39c;
}


/* SERVERS */

.servers {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 18px;
}


/* CARD */

.card {
    position: relative;

    overflow: hidden;

    padding: 25px;

    border-radius: 23px;

    background:
        linear-gradient(
            145deg,
            rgba(20,25,41,.90),
            rgba(10,13,23,.90)
        );

    border: 1px solid rgba(255,255,255,.075);

    box-shadow:
        0 25px 70px rgba(0,0,0,.30);

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
}

.card:hover {
    transform: translateY(-3px);

    border-color:
        rgba(255,255,255,.14);

    box-shadow:
        0 30px 80px rgba(0,0,0,.42);
}


/* TOP */

.card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 15px;
}

.server-info {
    display: flex;
    align-items: center;
    gap: 13px;
}

.flag {
    width: 52px;
    height: 52px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 16px;

    background:
        rgba(255,255,255,.055);

    border: 1px solid
        rgba(255,255,255,.06);

    font-size: 28px;
}

.server-name {
    font-size: 20px;
    font-weight: 800;
}

.server-type {
    margin-top: 4px;

    color: #697186;

    font-size: 12px;
}


/* STATUS */

.status {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 7px 10px;

    border-radius: 999px;

    background: rgba(255,255,255,.045);

    font-size: 10px;
    font-weight: 900;

    letter-spacing: .8px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;
}

.checking {
    color: #ffd45a;
}

.checking .status-dot {
    background: #ffd45a;

    box-shadow:
        0 0 10px #ffd45a;

    animation: statusPulse 1s infinite;
}

.online {
    color: #52f39c;

    background:
        rgba(82,243,156,.055);
}

.online .status-dot {
    background: #52f39c;

    box-shadow:
        0 0 12px #52f39c;
}

.offline {
    color: #ff5c69;

    background:
        rgba(255,92,105,.055);
}

.offline .status-dot {
    background: #ff5c69;

    box-shadow:
        0 0 12px #ff5c69;
}

@keyframes statusPulse {

    50% {
        opacity: .3;
    }

}


/* ENDPOINT */

.endpoint {
    margin-top: 24px;

    padding: 14px 16px;

    border-radius: 14px;

    background:
        rgba(0,0,0,.18);

    border:
        1px solid rgba(255,255,255,.045);
}

.endpoint-label {
    color: #626a7d;

    font-size: 9px;
    font-weight: 800;

    letter-spacing: 1.4px;
}

.endpoint-value {
    margin-top: 6px;

    color: #dfe4f1;

    font-family:
        "SFMono-Regular",
        Consolas,
        monospace;

    font-size: 13px;
}


/* METRICS */

.metrics {
    display: flex;

    align-items: flex-end;
    justify-content: space-between;

    margin-top: 22px;
}

.metric-label {
    color: #626a7d;

    font-size: 9px;
    font-weight: 800;

    letter-spacing: 1.3px;
}

.latency {
    margin-top: 5px;

    font-size: 30px;
    font-weight: 850;

    letter-spacing: -1px;
}

.latency span {
    color: #697186;

    font-size: 12px;
    font-weight: 500;

    letter-spacing: 0;
}

.protocol {
    color: #626a7d;

    font-size: 11px;
}


/* BUTTON */

.actions {
    display: flex;
    justify-content: center;

    margin-top: 22px;
}

button {
    display: inline-flex;
    align-items: center;
    gap: 9px;

    padding: 12px 17px;

    border-radius: 12px;

    border:
        1px solid rgba(255,255,255,.09);

    background:
        rgba(255,255,255,.055);

    color: #e9edf7;

    font-size: 12px;
    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

button:hover {
    background:
        rgba(255,255,255,.095);

    border-color:
        rgba(255,255,255,.15);
}

button:disabled {
    opacity: .5;
    cursor: default;
}

.refresh-icon {
    font-size: 15px;
}


/* UPDATED */

.updated {
    margin-top: 13px;

    text-align: center;

    color: #4e5669;

    font-size: 10px;
}


/* MOBILE */

@media (max-width: 760px) {

    .container {
        width: min(100% - 24px, 600px);
        padding-top: 30px;
    }

    header {
        align-items: flex-start;
        flex-direction: column;
    }

    .header-right {
        text-align: left;
    }

    .summary {
        grid-template-columns: 1fr;
    }

    .servers {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>

<div class="container">


<header>

    <div class="brand">

        <div class="logo">
            ◈
        </div>

        <div>

            <div class="eyebrow">
                Infrastructure
            </div>

            <h1>VPN Monitor</h1>

        </div>

    </div>


    <div class="header-right">

        <div class="live">
            <span class="live-dot"></span>
            LIVE MONITORING
        </div>

    </div>

</header>


<div class="summary">

    <div class="summary-card">

        <div class="summary-label">
            Servers
        </div>

        <div
            id="total"
            class="summary-value"
        >
            2
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Online
        </div>

        <div
            id="online"
            class="summary-value green"
        >
            —
        </div>

    </div>


    <div class="summary-card">

        <div class="summary-label">
            Last check
        </div>

        <div
            id="last"
            class="summary-value"
            style="font-size:17px"
        >
            —
        </div>

    </div>

</div>


<div class="servers">


<!-- SWITZERLAND -->

<div class="card">

    <div class="card-top">

        <div class="server-info">

            <div class="flag">
                🇨🇭
            </div>

            <div>

                <div class="server-name">
                    Switzerland
                </div>

                <div class="server-type">
                    VPN Server
                </div>

            </div>

        </div>


        <div
            id="status-ch"
            class="status checking"
        >

            <span class="status-dot"></span>

            CHECKING

        </div>

    </div>


    <div class="endpoint">

        <div class="endpoint-label">
            TCP ENDPOINT
        </div>

        <div class="endpoint-value">
            31.76.4.168:25558
        </div>

    </div>


    <div class="metrics">

        <div>

            <div class="metric-label">
                LATENCY
            </div>

            <div
                id="latency-ch"
                class="latency"
            >
                —
                <span>ms</span>
            </div>

        </div>


        <div class="protocol">
            TCP
        </div>

    </div>

</div>


<!-- POLAND -->

<div class="card">

    <div class="card-top">

        <div class="server-info">

            <div class="flag">
                🇵🇱
            </div>

            <div>

                <div class="server-name">
                    Poland
                </div>

                <div class="server-type">
                    VPN Server
                </div>

            </div>

        </div>


        <div
            id="status-pl"
            class="status checking"
        >

            <span class="status-dot"></span>

            CHECKING

        </div>

    </div>


    <div class="endpoint">

        <div class="endpoint-label">
            TCP ENDPOINT
        </div>

        <div class="endpoint-value">
            2.26.255.84:27489
        </div>

    </div>


    <div class="metrics">

        <div>

            <div class="metric-label">
                LATENCY
            </div>

            <div
                id="latency-pl"
                class="latency"
            >
                —
                <span>ms</span>
            </div>

        </div>


        <div class="protocol">
            TCP
        </div>

    </div>

</div>

</div>


<div class="actions">

    <button
        id="refresh"
        onclick="checkAll()"
    >

        <span class="refresh-icon">
            ↻
        </span>

        Проверить сейчас

    </button>

</div>


<div
    id="updated"
    class="updated"
>
    Выполняется первая проверка...
</div>


</div>


<script>

const SERVERS = {

    ch: {
        host: "31.76.4.168",
        port: 25558
    },

    pl: {
        host: "2.26.255.84",
        port: 27489
    }

};


function setStatus(
    server,
    state,
    latency = null
) {

    const status =
        document.getElementById(
            "status-" + server
        );

    const latencyElement =
        document.getElementById(
            "latency-" + server
        );


    if (state === "online") {

        status.className =
            "status online";

        status.innerHTML = `
            <span class="status-dot"></span>
            ONLINE
        `;

        latencyElement.innerHTML =
            `${Math.round(latency)}
             <span>ms</span>`;

    }


    else if (state === "offline") {

        status.className =
            "status offline";

        status.innerHTML = `
            <span class="status-dot"></span>
            OFFLINE
        `;

        latencyElement.innerHTML =
            `— <span>ms</span>`;

    }


    else {

        status.className =
            "status checking";

        status.innerHTML = `
            <span class="status-dot"></span>
            CHECKING
        `;

        latencyElement.innerHTML =
            `— <span>ms</span>`;

    }

}


async function checkServer(server) {

    setStatus(server, "checking");


    try {

        const response =
            await fetch(
                `/api/check?server=${server}&t=${Date.now()}`,
                {
                    cache: "no-store"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "HTTP " + response.status
            );

        }


        if (data.status === "online") {

            setStatus(
                server,
                "online",
                data.response_time_ms
            );

        } else {

            setStatus(
                server,
                "offline"
            );

        }


        return data.status === "online";


    } catch (error) {

        console.error(
            "VPN check error:",
            error
        );

        setStatus(
            server,
            "offline"
        );

        return false;
    }

}


async function checkAll() {

    const button =
        document.getElementById(
            "refresh"
        );

    button.disabled = true;


    const results =
        await Promise.all([
            checkServer("ch"),
            checkServer("pl")
        ]);


    const online =
        results.filter(Boolean).length;


    document.getElementById(
        "online"
    ).textContent =
        online + " / 2";


    const now =
        new Date();


    document.getElementById(
        "last"
    ).textContent =
        now.toLocaleTimeString(
            "ru-RU",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );


    document.getElementById(
        "updated"
    ).textContent =
        "Последняя проверка: " +
        now.toLocaleTimeString("ru-RU");


    button.disabled = false;

}


checkAll();


setInterval(
    checkAll,
    30000
);

</script>

</body>

</html>
