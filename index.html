<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Monitor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #fff;
            font-family: Inter, Arial, sans-serif;
            overflow-x: hidden;
        }

        .background {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255,255,255,.08),
                    transparent 35%
                ),
                #050505;
        }

        .orb {
            position: absolute;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(110px);
            opacity: .07;
            animation: float 12s ease-in-out infinite;
        }

        .orb.one {
            left: -160px;
            top: -180px;
            background: white;
        }

        .orb.two {
            right: -180px;
            top: 30%;
            background: white;
            animation-delay: -4s;
        }

        .orb.three {
            bottom: -220px;
            left: 35%;
            background: white;
            animation-delay: -8s;
        }

        @keyframes float {
            0%,100% {
                transform: translate(0,0);
            }
            50% {
                transform: translate(30px,-25px);
            }
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );
            background-size: 50px 50px;
            mask-image: linear-gradient(
                to bottom,
                black,
                transparent 90%
            );
        }

        .app {
            position: relative;
            z-index: 1;
            width: min(1100px, calc(100% - 30px));
            margin: auto;
            padding: 65px 0 50px;
        }

        header {
            text-align: center;
            margin-bottom: 42px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            margin-bottom: 18px;
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 999px;
            background: rgba(255,255,255,.035);
            color: #aaa;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 0 10px rgba(255,255,255,.7);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .35;
                transform: scale(.75);
            }
        }

        h1 {
            font-size: clamp(40px, 7vw, 68px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -.055em;
            background: linear-gradient(
                180deg,
                #fff,
                #999
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            margin-top: 16px;
            color: #777;
            font-size: 14px;
        }

        .servers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .card {
            padding: 26px;
            border: 1px solid rgba(255,255,255,.09);
            border-radius: 22px;
            background: linear-gradient(
                145deg,
                rgba(255,255,255,.065),
                rgba(255,255,255,.025)
            );
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
            transition: .3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(255,255,255,.17);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .server-name {
            font-size: 23px;
            font-weight: 750;
        }

        .server-location {
            margin-top: 5px;
            color: #777;
            font-size: 13px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(255,255,255,.045);
            color: #888;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            white-space: nowrap;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #666;
        }

        .status.online {
            color: #fff;
        }

        .status.online .status-dot {
            background: #fff;
            box-shadow: 0 0 12px rgba(255,255,255,.8);
            animation: pulse 1.8s infinite;
        }

        .status.offline {
            color: #777;
        }

        .status.offline .status-dot {
            background: #555;
        }

        .status.checking {
            color: #aaa;
        }

        .status.checking .status-dot {
            background: #aaa;
            animation: blink .8s infinite;
        }

        @keyframes blink {
            0%,100% {
                opacity: .25;
            }
            50% {
                opacity: 1;
            }
        }

        .latency {
            margin-top: 34px;
        }

        .latency-label {
            color: #666;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .1em;
        }

        .latency-value {
            margin-top: 5px;
            font-size: 37px;
            font-weight: 750;
            letter-spacing: -.04em;
        }

        .latency-value span {
            color: #666;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0;
        }

        .endpoint {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,.07);
            color: #666;
            font-family: monospace;
            font-size: 12px;
        }

        .uptime-box {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 1px;
            margin-top: 18px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 18px;
            background: rgba(255,255,255,.07);
        }

        .uptime-item {
            padding: 18px 15px;
            background: rgba(8,8,8,.85);
        }

        .uptime-label {
            color: #666;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
        }

        .uptime-value {
            margin-top: 7px;
            color: #eee;
            font-size: 17px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-top: 28px;
        }

        .refresh-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 12px 18px;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
            background: rgba(255,255,255,.055);
            color: #eee;
            font-size: 13px;
            font-weight: 650;
            cursor: pointer;
            transition: .2s ease;
        }

        .refresh-button:hover {
            background: rgba(255,255,255,.09);
            border-color: rgba(255,255,255,.2);
        }

        .refresh-button:active {
            transform: scale(.97);
        }

        .refresh-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .refresh-icon {
            width: 15px;
            height: 15px;
        }

        .refresh-button.loading .refresh-icon {
            animation: rotate .8s linear infinite;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        .auto-refresh {
            color: #555;
            font-size: 12px;
        }

        .last-update {
            margin-top: 18px;
            text-align: center;
            color: #4f4f4f;
            font-size: 11px;
        }

        @media (max-width: 700px) {
            .app {
                padding-top: 45px;
            }

            .servers {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 22px;
            }

            .uptime-box {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="background">
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <div class="grid"></div>
</div>

<main class="app">

    <header>
        <div class="badge">
            <span class="badge-dot"></span>
            VPN MONITOR
        </div>

        <h1>Server Status</h1>

        <p class="subtitle">
            Мониторинг доступности VPN-серверов
        </p>
    </header>


    <section class="servers">

        <!-- SWITZERLAND -->

        <article class="card">

            <div class="card-top">

                <div>
                    <div class="server-name">
                        Switzerland
                    </div>

                    <div class="server-location">
                        🇨🇭 Zurich
                    </div>
                </div>

                <div
                    class="status checking"
                    id="status-ch"
                >
                    <span class="status-dot"></span>
                    <span class="status-text">
                        Проверка
                    </span>
                </div>

            </div>

            <div class="latency">

                <div class="latency-label">
                    TCP Latency
                </div>

                <div
                    class="latency-value"
                    id="latency-ch"
                >
                    —
                    <span>ms</span>
                </div>

            </div>

            <div class="endpoint">
                31.76.4.168:25558
            </div>

            <div class="uptime-box">

                <div class="uptime-item">
                    <div class="uptime-label">
                        Uptime
                    </div>

                    <div
                        class="uptime-value"
                        id="uptime-ch"
                    >
                        —
                    </div>
                </div>

                <div class="uptime-item">
                    <div class="uptime-label">
                        Стабилен
                    </div>

                    <div
                        class="uptime-value"
                        id="stable-ch"
                    >
                        —
                    </div>
                </div>

                <div class="uptime-item">
                    <div class="uptime-label">
                        Сбоев
                    </div>

                    <div
                        class="uptime-value"
                        id="incidents-ch"
                    >
                        —
                    </div>
                </div>

            </div>

        </article>


        <!-- POLAND -->

        <article class="card">

            <div class="card-top">

                <div>
                    <div class="server-name">
                        Poland
                    </div>

                    <div class="server-location">
                        🇵🇱 Warsaw
                    </div>
                </div>

                <div
                    class="status checking"
                    id="status-pl"
                >
                    <span class="status-dot"></span>
                    <span class="status-text">
                        Проверка
                    </span>
                </div>

            </div>

            <div class="latency">

                <div class="latency-label">
                    TCP Latency
                </div>

                <div
                    class="latency-value"
                    id="latency-pl"
                >
                    —
                    <span>ms</span>
                </div>

            </div>

            <div class="endpoint">
                2.26.255.84:27489
            </div>

            <div class="uptime-box">

                <div class="uptime-item">
                    <div class="uptime-label">
                        Uptime
                    </div>

                    <div
                        class="uptime-value"
                        id="uptime-pl"
                    >
                        —
                    </div>
                </div>

                <div class="uptime-item">
                    <div class="uptime-label">
                        Стабилен
                    </div>

                    <div
                        class="uptime-value"
                        id="stable-pl"
                    >
                        —
                    </div>
                </div>

                <div class="uptime-item">
                    <div class="uptime-label">
                        Сбоев
                    </div>

                    <div
                        class="uptime-value"
                        id="incidents-pl"
                    >
                        —
                    </div>
                </div>

            </div>

        </article>

    </section>


    <div class="controls">

        <button
            class="refresh-button"
            id="refreshButton"
            type="button"
        >

            <svg
                class="refresh-icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 5v4h4"/>
                <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 19v-4h-4"/>
            </svg>

            Обновить

        </button>

        <div class="auto-refresh">
            Автообновление: 30 сек
        </div>

    </div>


    <div class="last-update">
        Последнее обновление:
        <span id="lastUpdate">—</span>
    </div>

</main>


<script>

    /*
     * ВАЖНО:
     * Здесь нет server.key.
     * Запросы идут напрямую:
     *
     * /api/check?server=ch
     * /api/check?server=pl
     */


    const REFRESH_INTERVAL = 30000;

    let refreshTimer = null;


    // =========================
    // STATUS
    // =========================

    function setStatus(server, status, latency = null) {

        const statusElement =
            document.getElementById(
                `status-${server}`
            );

        const latencyElement =
            document.getElementById(
                `latency-${server}`
            );


        if (!statusElement) return;


        statusElement.classList.remove(
            "online",
            "offline",
            "checking"
        );

        statusElement.classList.add(status);


        const text =
            statusElement.querySelector(
                ".status-text"
            );


        if (status === "online") {

            text.textContent = "ONLINE";

            if (
                latency !== null &&
                latency !== undefined
            ) {

                latencyElement.innerHTML =
                    `${Number(latency).toFixed(0)}
                    <span>ms</span>`;

            }

        }

        else if (status === "offline") {

            text.textContent = "OFFLINE";

            latencyElement.innerHTML =
                `—
                <span>ms</span>`;

        }

        else {

            text.textContent = "Проверка";

            latencyElement.innerHTML =
                `—
                <span>ms</span>`;

        }
    }


    // =========================
    // CHECK CH
    // =========================

    async function checkCH() {

        try {

            setStatus("ch", "checking");


            const response =
                await fetch(
                    `/api/check?server=ch&_=${Date.now()}`,
                    {
                        cache: "no-store"
                    }
                );


            const data =
                await response.json();


            console.log(
                "CH:",
                data
            );


            if (!response.ok) {
                throw new Error(
                    data.error ||
                    `HTTP ${response.status}`
                );
            }


            setStatus(
                "ch",
                data.status,
                data.response_time_ms
            );


        } catch (error) {

            console.error(
                "CH check error:",
                error
            );

            setStatus(
                "ch",
                "offline"
            );

        }
    }


    // =========================
    // CHECK PL
    // =========================

    async function checkPL() {

        try {

            setStatus("pl", "checking");


            const response =
                await fetch(
                    `/api/check?server=pl&_=${Date.now()}`,
                    {
                        cache: "no-store"
                    }
                );


            const data =
                await response.json();


            console.log(
                "PL:",
                data
            );


            if (!response.ok) {
                throw new Error(
                    data.error ||
                    `HTTP ${response.status}`
                );
            }


            setStatus(
                "pl",
                data.status,
                data.response_time_ms
            );


        } catch (error) {

            console.error(
                "PL check error:",
                error
            );

            setStatus(
                "pl",
                "offline"
            );

        }
    }


    // =========================
    // UPTIME
    // =========================

    async function loadUptime() {

        try {

            const response =
                await fetch(
                    `/api/status?_=${Date.now()}`,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const data =
                await response.json();


            console.log(
                "UPTIME:",
                data
            );


            if (
                !data ||
                !data.servers
            ) {
                return;
            }


            updateUptime(
                "ch",
                data.servers.ch
            );

            updateUptime(
                "pl",
                data.servers.pl
            );


        } catch (error) {

            console.error(
                "Uptime error:",
                error
            );

        }
    }


    function updateUptime(
        server,
        stats
    ) {

        if (!stats) return;


        const uptime =
            document.getElementById(
                `uptime-${server}`
            );

        const stable =
            document.getElementById(
                `stable-${server}`
            );

        const incidents =
            document.getElementById(
                `incidents-${server}`
            );


        if (uptime) {

            uptime.textContent =
                stats.uptime_percent !== null &&
                stats.uptime_percent !== undefined
                    ? `${stats.uptime_percent}%`
                    : "—";

        }


        if (stable) {

            stable.textContent =
                stats.stable_text ||
                "—";

        }


        if (incidents) {

            incidents.textContent =
                stats.incidents ?? 0;

        }

    }


    // =========================
    // TIME
    // =========================

    function updateTime() {

        const element =
            document.getElementById(
                "lastUpdate"
            );


        element.textContent =
            new Date().toLocaleTimeString(
                "ru-RU",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

    }


    // =========================
    // FULL CHECK
    // =========================

    async function checkAll() {

        const button =
            document.getElementById(
                "refreshButton"
            );


        button.classList.add(
            "loading"
        );

        button.disabled = true;


        try {

            await Promise.all([
                checkCH(),
                checkPL()
            ]);


            await loadUptime();

            updateTime();

        }

        finally {

            button.classList.remove(
                "loading"
            );

            button.disabled = false;

        }


        restartAutoRefresh();

    }


    // =========================
    // AUTO REFRESH
    // =========================

    function restartAutoRefresh() {

        if (refreshTimer) {
            clearTimeout(refreshTimer);
        }


        refreshTimer =
            setTimeout(
                checkAll,
                REFRESH_INTERVAL
            );

    }


    // =========================
    // BUTTON
    // =========================

    document
        .getElementById("refreshButton")
        .addEventListener(
            "click",
            checkAll
        );


    // =========================
    // START
    // =========================

    checkAll();

</script>

</body>
</html>
