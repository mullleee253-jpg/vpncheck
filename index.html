<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VPN Monitor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #020202;
            color: #fff;
            font-family:
                Inter,
                Arial,
                Helvetica,
                sans-serif;
        }

        body {
            overflow-x: hidden;
        }

        /* ========================================
           BACKGROUND
        ======================================== */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;

            background:
                radial-gradient(
                    circle at 50% -20%,
                    #171717 0%,
                    #050505 40%,
                    #000 80%
                );
        }

        .orb {
            position: absolute;

            width: 420px;
            height: 420px;

            border-radius: 50%;

            filter: blur(110px);

            opacity: .11;

            animation:
                floating 12s ease-in-out infinite;
        }

        .orb.one {
            background: #00ff88;

            left: -220px;
            top: 10%;
        }

        .orb.two {
            background: #0088ff;

            right: -220px;
            top: 45%;

            animation-delay: -5s;
        }

        .orb.three {
            background: white;

            left: 40%;
            bottom: -330px;

            opacity: .035;

            animation-delay: -8s;
        }

        @keyframes floating {
            0%,
            100% {
                transform:
                    translate3d(0, 0, 0)
                    scale(1);
            }

            50% {
                transform:
                    translate3d(40px, -50px, 0)
                    scale(1.12);
            }
        }

        .grid {
            position: absolute;
            inset: 0;

            opacity: .025;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.5) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.5) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            transform:
                perspective(500px)
                rotateX(55deg)
                scale(1.5);

            transform-origin:
                center bottom;

            animation:
                gridMove 15s linear infinite;
        }

        @keyframes gridMove {
            from {
                transform:
                    perspective(500px)
                    rotateX(55deg)
                    scale(1.5)
                    translateY(0);
            }

            to {
                transform:
                    perspective(500px)
                    rotateX(55deg)
                    scale(1.5)
                    translateY(55px);
            }
        }

        /* ========================================
           MAIN
        ======================================== */

        .container {
            position: relative;

            z-index: 2;

            width:
                min(
                    1050px,
                    calc(100% - 32px)
                );

            margin: 0 auto;

            padding:
                70px 0 60px;
        }

        header {
            text-align: center;

            margin-bottom: 45px;
        }

        .badge {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding:
                8px 13px;

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 999px;

            background:
                rgba(255,255,255,.035);

            backdrop-filter:
                blur(15px);

            color: #aaa;

            font-size: 12px;

            letter-spacing: .08em;

            text-transform:
                uppercase;
        }

        .badge-dot {
            width: 7px;
            height: 7px;

            background: #00ff88;

            border-radius: 50%;

            box-shadow:
                0 0 14px #00ff88;

            animation:
                pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: .4;
                transform: scale(.75);
            }
        }

        h1 {
            margin:
                20px 0 10px;

            font-size:
                clamp(
                    38px,
                    7vw,
                    70px
                );

            line-height: .95;

            letter-spacing: -.055em;

            font-weight: 800;
        }

        .subtitle {
            color: #777;

            font-size: 15px;
        }

        /* ========================================
           SERVERS
        ======================================== */

        .servers {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .card {
            position: relative;

            overflow: hidden;

            padding: 26px;

            border:
                1px solid
                rgba(255,255,255,.09);

            border-radius: 22px;

            background:
                rgba(10,10,10,.72);

            backdrop-filter:
                blur(20px);

            box-shadow:
                0 20px 60px
                rgba(0,0,0,.4),

                inset 0 1px 0
                rgba(255,255,255,.04);

            transition:
                transform .35s ease,
                border-color .35s ease,
                box-shadow .35s ease;
        }

        .card::before {
            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    120deg,
                    transparent 20%,
                    rgba(255,255,255,.035),
                    transparent 80%
                );

            transform:
                translateX(-100%);

            transition:
                transform .8s ease;
        }

        .card:hover {
            transform:
                translateY(-5px);

            border-color:
                rgba(255,255,255,.16);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,.55),

                inset 0 1px 0
                rgba(255,255,255,.06);
        }

        .card:hover::before {
            transform:
                translateX(100%);
        }

        /* ========================================
           TOP
        ======================================== */

        .top {
            display: flex;

            justify-content:
                space-between;

            align-items:
                flex-start;

            margin-bottom: 35px;
        }

        .country {
            display: flex;

            align-items:
                center;

            gap: 12px;
        }

        .flag {
            font-size: 32px;
        }

        .country-name {
            font-size: 18px;

            font-weight: 700;
        }

        .location {
            margin-top: 4px;

            color: #666;

            font-size: 12px;
        }

        /* ========================================
           STATUS
        ======================================== */

        .status {
            display: flex;

            align-items: center;

            gap: 7px;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: .1em;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #777;
        }

        .online .status-dot {
            background: #00ff88;

            box-shadow:
                0 0 16px #00ff88;

            animation:
                pulse 1.5s infinite;
        }

        .offline .status-dot {
            background: #ff4545;

            box-shadow:
                0 0 12px
                rgba(255,69,69,.7);
        }

        .checking .status-dot {
            background: #ffc400;

            box-shadow:
                0 0 12px
                rgba(255,196,0,.7);

            animation:
                pulse .7s infinite;
        }

        .unknown .status-dot {
            background: #777;
        }

        .status-text {
            color: #777;
        }

        .online .status-text {
            color: #00ff88;
        }

        .offline .status-text {
            color: #ff5555;
        }

        .checking .status-text {
            color: #ffc400;
        }

        /* ========================================
           METRICS
        ======================================== */

        .metrics {
            display: flex;

            align-items:
                flex-end;

            justify-content:
                space-between;
        }

        .latency-value {
            font-size: 48px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -.06em;
        }

        .latency-unit {
            color: #555;

            font-size: 13px;

            margin-left: 5px;
        }

        .endpoint {
            text-align: right;

            color: #666;

            font-family:
                monospace;

            font-size: 12px;
        }

        /* ========================================
           UPTIME
        ======================================== */

        .uptime-box {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-top: 22px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(255,255,255,.06);
        }

        .uptime-item {
            min-width: 0;

            display: flex;

            flex-direction:
                column;

            gap: 5px;
        }

        .uptime-label {
            color: #555;

            font-size: 10px;

            text-transform:
                uppercase;

            letter-spacing: .08em;
        }

        .uptime-value,
        .stable-value,
        .incidents-value {
            color: #ddd;

            font-size: 14px;

            font-weight: 600;

            white-space: nowrap;
        }

        .uptime-value {
            color: #00ff88;
        }

        /* ========================================
           FOOTER CARD
        ======================================== */

        .footer {
            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap: 10px;

            margin-top: 25px;

            padding-top: 18px;

            border-top:
                1px solid
                rgba(255,255,255,.06);

            color: #555;

            font-size: 12px;
        }

        .server-error {
            color: #777;

            font-family:
                monospace;

            font-size: 10px;

            overflow: hidden;

            text-overflow:
                ellipsis;

            white-space: nowrap;
        }

        /* ========================================
           BUTTON
        ======================================== */

        .controls {
            display: flex;

            justify-content:
                center;

            margin-top: 28px;
        }

        button {
            display: inline-flex;

            align-items:
                center;

            gap: 10px;

            padding:
                13px 20px;

            border:
                1px solid
                rgba(255,255,255,.1);

            border-radius: 12px;

            background:
                rgba(255,255,255,.05);

            color: #ddd;

            cursor: pointer;

            font-size: 13px;

            transition:
                .25s ease;
        }

        button:hover {
            background:
                rgba(255,255,255,.09);

            border-color:
                rgba(255,255,255,.18);

            transform:
                translateY(-2px);
        }

        button:active {
            transform:
                translateY(0);
        }

        button:disabled {
            opacity: .6;

            cursor:
                not-allowed;
        }

        .refresh-icon {
            display: inline-block;

            font-size: 17px;
        }

        button.loading .refresh-icon {
            animation:
                spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform:
                    rotate(360deg);
            }
        }

        /* ========================================
           LAST UPDATE
        ======================================== */

        .update-info {
            margin-top: 20px;

            text-align: center;

            color: #444;

            font-size: 11px;
        }

        /* ========================================
           TIMER
        ======================================== */

        .timer {
            position: fixed;

            bottom: 0;
            left: 0;

            width: 100%;

            height: 2px;

            background:
                rgba(255,255,255,.04);

            z-index: 10;
        }

        .timer-bar {
            height: 100%;

            width: 100%;

            background: #00ff88;

            transform-origin:
                left center;

            box-shadow:
                0 0 10px #00ff88;
        }

        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 700px) {

            .container {
                padding-top: 40px;
            }

            .servers {
                grid-template-columns:
                    1fr;
            }

            .card {
                padding: 22px;
            }

            .latency-value {
                font-size: 42px;
            }

        }

        @media (max-width: 430px) {

            .top {
                margin-bottom: 28px;
            }

            .country-name {
                font-size: 16px;
            }

            .endpoint {
                font-size: 10px;
            }

            .uptime-box {
                grid-template-columns:
                    repeat(3, 1fr);

                gap: 7px;
            }

            .uptime-value,
            .stable-value,
            .incidents-value {
                font-size: 12px;
            }

            .uptime-label {
                font-size: 9px;
            }

        }

    </style>
</head>


<body>

    <!-- ========================================
         ANIMATED BACKGROUND
    ======================================== -->

    <div class="background">

        <div class="orb one"></div>

        <div class="orb two"></div>

        <div class="orb three"></div>

        <div class="grid"></div>

    </div>


    <!-- ========================================
         MAIN
    ======================================== -->

    <main class="container">


        <!-- HEADER -->

        <header>

            <div class="badge">

                <span class="badge-dot"></span>

                VPN Network Monitor

            </div>


            <h1>
                Server Status
            </h1>


            <div class="subtitle">
                Real-time TCP connectivity monitoring
            </div>

        </header>



        <!-- ====================================
             SERVERS
        ==================================== -->

        <section class="servers">


            <!-- ==================================
                 SWITZERLAND
            ================================== -->

            <article
                class="card"
                id="server-ch"
            >

                <div class="top">

                    <div class="country">

                        <div class="flag">
                            🇨🇭
                        </div>


                        <div>

                            <div class="country-name">
                                Switzerland
                            </div>

                            <div class="location">
                                VPN Node · CH
                            </div>

                        </div>

                    </div>


                    <div class="status checking">

                        <span class="status-dot"></span>

                        <span class="status-text">
                            CHECKING
                        </span>

                    </div>

                </div>


                <!-- LATENCY -->

                <div class="metrics">

                    <div>

                        <span class="latency-value">
                            —
                        </span>

                        <span class="latency-unit">
                            ms
                        </span>

                    </div>


                    <div class="endpoint">
                        31.76.4.168:25558
                    </div>

                </div>


                <!-- UPTIME -->

                <div class="uptime-box">


                    <div class="uptime-item">

                        <span class="uptime-label">
                            Uptime
                        </span>

                        <strong
                            class="uptime-value"
                            data-uptime="ch"
                        >
                            —
                        </strong>

                    </div>


                    <div class="uptime-item">

                        <span class="uptime-label">
                            Стабилен
                        </span>

                        <strong
                            class="stable-value"
                            data-stable="ch"
                        >
                            —
                        </strong>

                    </div>


                    <div class="uptime-item">

                        <span class="uptime-label">
                            Сбоев
                        </span>

                        <strong
                            class="incidents-value"
                            data-incidents="ch"
                        >
                            —
                        </strong>

                    </div>


                </div>


                <div class="footer">

                    <span>
                        TCP connection
                    </span>

                    <span
                        class="server-error"
                        data-error="ch"
                    ></span>

                </div>

            </article>



            <!-- ==================================
                 POLAND
            ================================== -->

            <article
                class="card"
                id="server-pl"
            >

                <div class="top">

                    <div class="country">

                        <div class="flag">
                            🇵🇱
                        </div>


                        <div>

                            <div class="country-name">
                                Poland
                            </div>

                            <div class="location">
                                VPN Node · PL
                            </div>

                        </div>

                    </div>


                    <div class="status checking">

                        <span class="status-dot"></span>

                        <span class="status-text">
                            CHECKING
                        </span>

                    </div>

                </div>


                <!-- LATENCY -->

                <div class="metrics">

                    <div>

                        <span class="latency-value">
                            —
                        </span>

                        <span class="latency-unit">
                            ms
                        </span>

                    </div>


                    <div class="endpoint">
                        2.26.255.84:27489
                    </div>

                </div>


                <!-- UPTIME -->

                <div class="uptime-box">


                    <div class="uptime-item">

                        <span class="uptime-label">
                            Uptime
                        </span>

                        <strong
                            class="uptime-value"
                            data-uptime="pl"
                        >
                            —
                        </strong>

                    </div>


                    <div class="uptime-item">

                        <span class="uptime-label">
                            Стабилен
                        </span>

                        <strong
                            class="stable-value"
                            data-stable="pl"
                        >
                            —
                        </strong>

                    </div>


                    <div class="uptime-item">

                        <span class="uptime-label">
                            Сбоев
                        </span>

                        <strong
                            class="incidents-value"
                            data-incidents="pl"
                        >
                            —
                        </strong>

                    </div>


                </div>


                <div class="footer">

                    <span>
                        TCP connection
                    </span>

                    <span
                        class="server-error"
                        data-error="pl"
                    ></span>

                </div>

            </article>


        </section>



        <!-- ========================================
             REFRESH BUTTON
        ======================================== -->

        <div class="controls">

            <button id="refreshBtn">

                <span class="refresh-icon">
                    ↻
                </span>

                Check servers

            </button>

        </div>



        <!-- ========================================
             LAST UPDATE
        ======================================== -->

        <div class="update-info">

            Last update:

            <span id="lastUpdate">
                —
            </span>

        </div>


    </main>



    <!-- ========================================
         TIMER
    ======================================== -->

    <div class="timer">

        <div
            class="timer-bar"
            id="timerBar"
        ></div>

    </div>



<script>

    /* ========================================
       CONFIG
    ======================================== */

    const SERVERS = [

        {
            id: "server-ch",
            key: "ch",
            host: "31.76.4.168",
            port: 25558
        },

        {
            id: "server-pl",
            key: "pl",
            host: "2.26.255.84",
            port: 27489
        }

    ];


    const REFRESH_INTERVAL =
        30000;


    let refreshTimer = null;

    let animationFrame = null;

    let timerStart = 0;



    /* ========================================
       SET SERVER STATUS
    ======================================== */

    function setStatus(
        card,
        status,
        latency = null,
        error = ""
    ) {

        const statusEl =
            card.querySelector(".status");


        const textEl =
            card.querySelector(".status-text");


        const latencyEl =
            card.querySelector(
                ".latency-value"
            );


        const errorEl =
            card.querySelector(
                ".server-error"
            );


        statusEl.className =
            "status " + status;



        if (status === "online") {

            textEl.textContent =
                "ONLINE";


            latencyEl.textContent =
                latency ?? "—";

        }


        else if (
            status === "offline"
        ) {

            textEl.textContent =
                "OFFLINE";


            latencyEl.textContent =
                "—";

        }


        else if (
            status === "checking"
        ) {

            textEl.textContent =
                "CHECKING";


            latencyEl.textContent =
                "—";

        }


        else {

            textEl.textContent =
                "UNKNOWN";


            latencyEl.textContent =
                "—";

        }


        errorEl.textContent =
            error || "";

    }



    /* ========================================
       CHECK TCP SERVER
    ======================================== */

    async function checkServer(
        server
    ) {

        const card =
            document.getElementById(
                server.id
            );


        setStatus(
            card,
            "checking"
        );


        try {

            const url =
                "/api/check" +
                "?server=" +
                encodeURIComponent(
                    server.key
                );


            const response =
                await fetch(
                    url,
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    "HTTP " +
                    response.status
                );

            }


            const data =
                await response.json();


            if (
                data.status ===
                "online"
            ) {

                setStatus(
                    card,
                    "online",
                    Math.round(
                        data.response_time_ms
                    )
                );

            }


            else if (
                data.status ===
                "offline"
            ) {

                setStatus(
                    card,
                    "offline",
                    null,
                    data.error || ""
                );

            }


            else {

                setStatus(
                    card,
                    "unknown",
                    null,
                    data.error || ""
                );

            }

        }


        catch (error) {

            console.error(
                "Check error:",
                error
            );


            setStatus(
                card,
                "unknown",
                null,
                "API error"
            );

        }

    }



    /* ========================================
       LOAD UPTIME DATA
    ======================================== */

    async function loadUptime() {

        try {

            const response =
                await fetch(
                    "/api/status",
                    {
                        method: "GET",
                        cache: "no-store"
                    }
                );


            if (!response.ok) {
                return;
            }


            const data =
                await response.json();


            if (!data.ok) {
                return;
            }



            for (
                const key of
                ["ch", "pl"]
            ) {

                const server =
                    data.servers[key];


                if (!server) {
                    continue;
                }



                /* UPTIME */

                const uptime =
                    document.querySelector(
                        `[data-uptime="${key}"]`
                    );


                if (
                    server.uptime_percent !==
                    null &&
                    server.uptime_percent !==
                    undefined
                ) {

                    uptime.textContent =
                        server.uptime_percent +
                        "%";

                }



                /* STABLE */

                const stable =
                    document.querySelector(
                        `[data-stable="${key}"]`
                    );


                if (
                    server.status ===
                    "online"
                ) {

                    stable.textContent =
                        server.stable_text;

                }


                else if (
                    server.status ===
                    "offline"
                ) {

                    stable.textContent =
                        "DOWN " +
                        server.downtime_text;

                }


                else {

                    stable.textContent =
                        "—";

                }



                /* INCIDENTS */

                const incidents =
                    document.querySelector(
                        `[data-incidents="${key}"]`
                    );


                incidents.textContent =
                    server.incidents ??
                    0;

            }

        }


        catch (error) {

            console.error(
                "Uptime error:",
                error
            );

        }

    }



    /* ========================================
       CHECK EVERYTHING
    ======================================== */

    async function checkAll() {

        const button =
            document.getElementById(
                "refreshBtn"
            );


        button.classList.add(
            "loading"
        );


        button.disabled =
            true;



        /*
         * TCP checks
         */

        await Promise.all(

            SERVERS.map(
                server =>
                    checkServer(
                        server
                    )
            )

        );



        /*
         * Load database statistics
         */

        await loadUptime();



        /*
         * Update timestamp
         */

        document.getElementById(
            "lastUpdate"
        ).textContent =
            new Date()
                .toLocaleTimeString();



        button.classList.remove(
            "loading"
        );


        button.disabled =
            false;



        restartTimer();

    }



    /* ========================================
       AUTO REFRESH TIMER
    ======================================== */

    function restartTimer() {

        clearTimeout(
            refreshTimer
        );


        cancelAnimationFrame(
            animationFrame
        );


        timerStart =
            performance.now();



        function animate(now) {

            const elapsed =
                now - timerStart;


            const progress =
                Math.min(
                    elapsed /
                    REFRESH_INTERVAL,
                    1
                );


            const bar =
                document.getElementById(
                    "timerBar"
                );


            bar.style.transform =
                `scaleX(${1 - progress})`;



            if (
                progress < 1
            ) {

                animationFrame =
                    requestAnimationFrame(
                        animate
                    );

            }

        }



        animationFrame =
            requestAnimationFrame(
                animate
            );



        refreshTimer =
            setTimeout(
                checkAll,
                REFRESH_INTERVAL
            );

    }



    /* ========================================
       MANUAL BUTTON
    ======================================== */

    document
        .getElementById(
            "refreshBtn"
        )
        .addEventListener(
            "click",
            checkAll
        );



    /* ========================================
       START
    ======================================== */

    checkAll();


</script>
